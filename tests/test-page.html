<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tempo test page</title>
  <style>
    body { margin: 0; font: 15px system-ui, sans-serif; background: #0f0d16; color: #e9e6f2; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 22px; }
    .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
    .player video { width: 100%; height: 100%; display: block; }
    .row { display: flex; gap: 16px; margin-top: 16px; }
    .row > * { flex: 1; }
    iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .meta { color: #a7a2b8; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Lecture 7: Linear algebra refresher</h1>
    <div class="player" id="mainPlayer"><video id="main" controls playsinline></video></div>
    <p class="meta" id="status">generating test video...</p>
    <div class="row" id="extras">
      <iframe id="frame" title="embedded player"></iframe>
      <div id="shadowHost" class="player"></div>
    </div>
  </div>
  <script>
    // Builds a real WebM in-page (MediaRecorder over an animated canvas) so the
    // test needs no binary fixtures. Exposes window.ready (Promise<blobUrl>).
    const params = new URLSearchParams(location.search);
    const isFrame = params.has("frame");
    const SECONDS = Number(params.get("secs") || 6);

    function makeVideo(label, hue) {
      const c = document.createElement("canvas");
      c.width = 640; c.height = 360;
      const g = c.getContext("2d");
      const stream = c.captureStream(30);
      // Add an audible tone track so "unmuted playing" stats can be exercised.
      const ac = new AudioContext();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      gain.gain.value = 0.02;
      osc.frequency.value = 220;
      const dest = ac.createMediaStreamDestination();
      osc.connect(gain).connect(dest);
      osc.start();
      stream.addTrack(dest.stream.getAudioTracks()[0]);
      const rec = new MediaRecorder(stream, { mimeType: "video/webm" });
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      const t0 = performance.now();
      let raf;
      const draw = () => {
        const t = (performance.now() - t0) / 1000;
        const grd = g.createLinearGradient(0, 0, 640, 360);
        grd.addColorStop(0, `hsl(${hue}, 55%, 22%)`);
        grd.addColorStop(1, `hsl(${hue + 40}, 60%, 12%)`);
        g.fillStyle = grd; g.fillRect(0, 0, 640, 360);
        g.fillStyle = `hsla(${hue + 80}, 80%, 70%, .9)`;
        g.beginPath(); g.arc(320 + Math.cos(t * 2) * 160, 190 + Math.sin(t * 3) * 70, 34, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#fff"; g.font = "600 30px system-ui"; g.fillText(label, 40, 70);
        g.font = "20px system-ui"; g.fillStyle = "#cfc8e6"; g.fillText("t = " + t.toFixed(1) + "s", 40, 320);
        raf = requestAnimationFrame(draw);
      };
      draw();
      rec.start(250);
      return new Promise((resolve) => {
        setTimeout(() => {
          rec.onstop = () => { cancelAnimationFrame(raf); osc.stop(); ac.close(); resolve(URL.createObjectURL(new Blob(chunks, { type: "video/webm" }))); };
          rec.stop();
        }, SECONDS * 1000);
      });
    }

    // An endless canvas stream: duration Infinity, like an HLS/MSE live stream.
    function liveStream(label) {
      const c = document.createElement("canvas");
      c.width = 640; c.height = 360;
      const g = c.getContext("2d");
      const t0 = performance.now();
      (function draw() {
        const t = (performance.now() - t0) / 1000;
        g.fillStyle = "#2a0f1e"; g.fillRect(0, 0, 640, 360);
        g.fillStyle = "#ff5c7a"; g.font = "600 30px system-ui"; g.fillText(label + "  " + t.toFixed(1) + "s", 40, 70);
        requestAnimationFrame(draw);
      })();
      return c.captureStream(30);
    }

    if (params.has("live")) {
      document.getElementById("extras").remove();
      const main = document.getElementById("main");
      if (params.get("live") === "yt") {
        // YouTube live videos report a finite duration; only the player API says "live".
        const mp = document.getElementById("mainPlayer");
        mp.id = "movie_player";
        mp.getVideoData = () => ({ isLive: true });
        window.ready = makeVideo("YouTube-style live", 120).then((u) => { main.src = u; return u; });
      } else {
        window.liveStream = liveStream("LIVE");
        main.srcObject = window.liveStream;
        window.ready = makeVideo("Next video", 265).then((u) => { window.vodUrl = u; return u; });
      }
    } else if (isFrame) {
      document.body.innerHTML = '<video id="main" controls style="width:100%;height:100vh;display:block;background:#000"></video>';
      document.body.style.margin = "0";
      window.ready = makeVideo("Embedded player", 200).then((u) => { document.getElementById("main").src = u; return u; });
    } else if (params.has("relay")) {
      // Only an embedded player: keys pressed in the top page must reach the iframe.
      document.getElementById("mainPlayer").remove();
      document.getElementById("shadowHost").remove();
      const f = document.getElementById("frame");
      window.ready = new Promise((resolve) => {
        f.onload = () => f.contentWindow.ready.then(resolve);
        f.src = location.pathname + "?frame=1&secs=" + SECONDS;
      });
    } else {
      document.getElementById("frame").src = location.pathname + "?frame=1&secs=" + SECONDS;
      // A player inside an open shadow root, like many web-component players.
      const sr = document.getElementById("shadowHost").attachShadow({ mode: "open" });
      const sv = document.createElement("video");
      sv.id = "shadowVideo";
      sv.style.cssText = "width:100%;height:100%;display:block";
      sr.append(sv);
      window.ready = Promise.all([makeVideo("Lecture 7", 265), makeVideo("Shadow DOM player", 20)]).then(([a, b]) => {
        document.getElementById("main").src = a;
        sv.src = b;
        document.getElementById("status").textContent = "ready";
        return a;
      });
    }
  </script>
</body>
</html>
